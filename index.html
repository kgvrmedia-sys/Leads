<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGVR lead tracker</title>
<meta name="theme-color" content="#1F6F5C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leads">

<style>
:root{--bg:#F1F3F0;--surface:#FFFFFF;--ink:#1B2420;--muted:#5C6962;--line:#D3D9D4;--accent:#1F6F5C;--accent-ink:#FFFFFF;--gold:#A87A1E;--warn:#9A4B1B;--field:#F7F9F7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121715;--surface:#1A211E;--ink:#E5EBE7;--muted:#95A29B;--line:#2B3631;--accent:#58BDA0;--accent-ink:#0F1A16;--gold:#D6AA4C;--warn:#E09A62;--field:#141A18;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{padding:18px 16px 10px;max-width:760px;margin:0 auto}
h1{font:600 24px/1.2 Georgia,"Iowan Old Style","Times New Roman",serif;margin:0 0 4px;letter-spacing:.2px}
#sum{color:var(--muted);font-size:13px}
#saved{float:right;font-size:12px;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px 10px;max-width:760px;margin:0 auto}
input[type=search],input[type=text],textarea,select,input[type=date]{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit}
textarea{min-height:72px;resize:vertical}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.chip,.tog{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true],.tog[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 select{flex:1;min-width:0}
main{max-width:760px;margin:0 auto;padding:0 0 60px}
.lead{border-bottom:1px solid var(--line);background:var(--surface);border-left:4px solid var(--line)}
.lead[data-s="Screening"]{border-left-color:#8A8F2E}
.lead[data-s="Ready"]{border-left-color:var(--accent)}
.lead[data-s="DM sent"]{border-left-color:#2F6DB5}
.lead[data-s="Replied"]{border-left-color:#7A4CB0}
.lead[data-s="Trial sent"]{border-left-color:var(--gold)}
.lead[data-s="Won"]{border-left-color:#2E9B54}
.lead[data-s="Dropped"]{opacity:.5}
.head{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.keep{flex:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;background:transparent;color:var(--accent-ink);font-size:16px;line-height:1;cursor:pointer;padding:0}
.keep[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.t{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted)}
.flag{color:var(--warn)}
.pill{flex:none;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.body{display:none;padding:2px 12px 14px 48px}
.lead.open .body{display:block}
.note{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.links{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
a{color:var(--accent)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0 12px}
.checks label,.lab{font-size:13.5px}
.checks label{display:flex;gap:8px;align-items:center}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.full{grid-column:1/-1}
.lab{display:block;color:var(--muted);margin-bottom:3px;font-size:12.5px}
.empty{padding:30px 16px;color:var(--muted);text-align:center}
.foot{display:flex;gap:8px;padding:14px 16px;max-width:760px;margin:0 auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}
#csvbox{display:none;padding:0 16px 40px;max-width:760px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<header><span id="saved"></span><h1>KGVR lead tracker</h1><div id="sum"></div></header>
<div class="bar">
<input type="search" id="q" placeholder="Search name, site, handle, notes" aria-label="Search">
<div class="chips" id="cur"></div>
<div class="row2"><select id="src" aria-label="Source"></select><select id="st" aria-label="Status"></select></div>
<div class="chips"><button class="tog" id="kept" aria-pressed="false">Kept only</button><button class="tog" id="nof" aria-pressed="false">Hide chains and odd data</button></div>
</div>
<main id="list"></main>
<div class="foot"><button class="btn" id="exp">Export CSV</button><button class="btn" id="rst">Reset all</button></div>
<div id="csvbox"><div class="lab">Select all and copy:</div><textarea id="csv" readonly style="min-height:200px"></textarea></div>

const STATUSES=['New','Screening','Ready','DM sent','Replied','Trial sent','Won','Dropped'];
const CHECKS=['200 to 5K followers','Posted in last 30 days','Messy look','No designer tagged'];
const KEY='kgvr-lead-tracker-v1';
let saved={},open=new Set(),F={q:'',cur:'All',src:'All',st:'All',kept:false,nof:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function S(l){return Object.assign({keep:l.keep,status:l.status,ig:l.ig,owner:l.owner,contact:l.contact,notes:'',date:'',checks:[0,0,0,0]},saved[l.id]||{})}
function put(id,patch){const l=LEADS.find(x=>x.id===id);saved[id]=Object.assign(S(l),patch);persist()}
let timer;function persist(){$('#saved').textContent='Saving...';clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(saved));$('#saved').textContent='Saved on this phone'}catch(e){$('#saved').textContent='Could not save'}},300)}
async function load(){try{const v=localStorage.getItem(KEY);if(v)saved=JSON.parse(v)}catch(e){}}
function initFilters(){
 $('#cur').innerHTML=['All','GBP','EUR','USD'].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c==='All'}">${c}</button>`).join('');
 $('#src').innerHTML=['All','Checked','Kimi','Explee'].map(c=>`<option value="${c}">${c==='All'?'All sources':c}</option>`).join('');
 $('#st').innerHTML=['All',...STATUSES].map(c=>`<option value="${c}">${c==='All'?'All statuses':c}</option>`).join('');
}
function match(l){const s=S(l);
 if(F.cur!=='All'&&l.cur!==F.cur)return false;
 if(F.src!=='All'&&l.src!==F.src)return false;
 if(F.st!=='All'&&s.status!==F.st)return false;
 if(F.kept&&!s.keep)return false;
 if(F.nof&&l.flags)return false;
 if(F.q){const h=[l.name,l.site,s.ig,s.owner,l.note,s.notes,l.sector].join(' ').toLowerCase();if(!h.includes(F.q))return false}
 return true}
function row(l){const s=S(l),o=open.has(l.id);
 const fl=(l.flags.includes('C')?' <span class="flag" title="Chain or multi-site">chain?</span>':'')+(l.flags.includes('W')?' <span class="flag" title="Data looks off">check data</span>':'');
 const score=s.checks.reduce((a,b)=>a+b,0);
 const links=(l.site?`<a href="https://${esc(l.site)}" target="_blank" rel="noopener">Website</a>`:'')+(s.ig?`<a href="https://instagram.com/${esc(s.ig.replace('@',''))}" target="_blank" rel="noopener">Instagram</a>`:'');
 return `<div class="lead${o?' open':''}" data-id="${l.id}" data-s="${esc(s.status)}">
 <div class="head" data-t="1"><button class="keep" data-k="1" aria-pressed="${s.keep}" aria-label="Keep ${esc(l.name)}">${s.keep?'&#10003;':''}</button>
 <div class="t"><div class="name">${esc(l.name)}</div><div class="meta">${l.cur} &middot; ${esc(l.sector)} &middot; ${l.src}${score?` &middot; screen ${score}/4`:''}${fl}</div></div>
 <span class="pill">${esc(s.status)}</span></div>
 <div class="body"><p class="note">${esc(l.note)}</p><div class="links">${links}</div>
 <div class="checks">${CHECKS.map((c,i)=>`<label><input type="checkbox" data-ch="${i}" ${s.checks[i]?'checked':''}>${c}</label>`).join('')}</div>
 <div class="grid"><div><span class="lab">Status</span><select data-f="status">${STATUSES.map(x=>`<option${x===s.status?' selected':''}>${x}</option>`).join('')}</select></div>
 <div><span class="lab">Last contact</span><input type="date" data-f="date" value="${esc(s.date)}"></div>
 <div><span class="lab">Instagram handle</span><input type="text" data-f="ig" value="${esc(s.ig)}" placeholder="handle"></div>
 <div><span class="lab">Owner</span><input type="text" data-f="owner" value="${esc(s.owner)}"></div>
 <div class="full"><span class="lab">Contact route</span><input type="text" data-f="contact" value="${esc(s.contact)}"></div>
 <div class="full"><span class="lab">Notes</span><textarea data-f="notes">${esc(s.notes)}</textarea></div></div></div></div>`}
function render(){const L=LEADS.filter(match);
 $('#list').innerHTML=L.length?L.map(row).join(''):'<div class="empty">No leads match these filters.</div>';counts(L.length)}
function counts(n){const all=LEADS.map(S);const c=k=>all.filter(x=>x.status===k).length;
 $('#sum').textContent=`${n} shown of ${LEADS.length} \u00b7 ${all.filter(x=>x.keep).length} kept \u00b7 ${c('DM sent')} DM sent \u00b7 ${c('Replied')} replied \u00b7 ${c('Won')} won`}
$('#list').addEventListener('click',e=>{const lead=e.target.closest('.lead');if(!lead)return;const id=+lead.dataset.id;
 if(e.target.closest('[data-k]')){const s=S(LEADS.find(x=>x.id===id));put(id,{keep:!s.keep});render();return}
 if(e.target.closest('.head')){open.has(id)?open.delete(id):open.add(id);lead.classList.toggle('open')}});
$('#list').addEventListener('change',e=>{const lead=e.target.closest('.lead');if(!lead)return;const id=+lead.dataset.id;
 if(e.target.dataset.ch!==undefined){const s=S(LEADS.find(x=>x.id===id));const ch=[...s.checks];ch[+e.target.dataset.ch]=e.target.checked?1:0;put(id,{checks:ch});counts($('#list').querySelectorAll('.lead').length);return}
 if(e.target.dataset.f==='status'){put(id,{status:e.target.value});render()}
 else if(e.target.dataset.f){put(id,{[e.target.dataset.f]:e.target.value})}});
$('#list').addEventListener('input',e=>{const lead=e.target.closest('.lead');if(!lead||!e.target.dataset.f||e.target.dataset.f==='status')return;put(+lead.dataset.id,{[e.target.dataset.f]:e.target.value})});
$('#q').addEventListener('input',e=>{F.q=e.target.value.trim().toLowerCase();render()});
$('#cur').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;F.cur=b.dataset.c;document.querySelectorAll('#cur .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#src').addEventListener('change',e=>{F.src=e.target.value;render()});
$('#st').addEventListener('change',e=>{F.st=e.target.value;render()});
$('#kept').addEventListener('click',e=>{F.kept=!F.kept;e.currentTarget.setAttribute('aria-pressed',F.kept);render()});
$('#nof').addEventListener('click',e=>{F.nof=!F.nof;e.currentTarget.setAttribute('aria-pressed',F.nof);render()});
$('#exp').addEventListener('click',()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=[['name','site','currency','sector','source','status','kept','instagram','owner','contact','last contact','screen checks','notes'].map(q).join(',')];
 LEADS.forEach(l=>{const s=S(l);rows.push([l.name,l.site,l.cur,l.sector,l.src,s.status,s.keep?'yes':'',s.ig,s.owner,s.contact,s.date,s.checks.join(''),s.notes].map(q).join(','))});
 $('#csv').value=rows.join('\n');$('#csvbox').style.display='block';$('#csv').focus();$('#csv').select()});
let armed=false;$('#rst').addEventListener('click',e=>{if(!armed){armed=true;e.currentTarget.textContent='Tap again to erase all ticks and notes';setTimeout(()=>{armed=false;$('#rst').textContent='Reset all'},4000);return}
 saved={};armed=false;e.currentTarget.textContent='Reset all';persist();render()});
(async()=>{initFilters();await load();render();$('#saved').textContent=''})();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
